<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moment of a Force – Linear Algebra</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="../shared/layout.css">
  <style>
    .vec-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 17px;
      font-weight: bold;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 6px #fff, 0 0 6px #fff;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div id="panel">
      <a href="../index.html" id="back">← All visualizations</a>
      <div id="subject">Linear Algebra → Application</div>
      <h1 id="step-title"></h1>
      <p id="step-description"></p>
      <div id="equation"></div>
      <p id="step-notes"></p>
      <div id="nav">
        <button id="prev">← Prev</button>
        <span id="counter"></span>
        <button id="next">Next →</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- Scene setup ---
    const canvas = document.getElementById('canvas');
    const container = document.getElementById('canvas-container');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);

    // Label renderer overlaid on the canvas
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    container.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(3, 4, 6);
    camera.lookAt(1, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(1, 0, 0);

    scene.add(new THREE.AxesHelper(3));
    scene.add(new THREE.GridHelper(8, 8, 0xcccccc, 0xe8e8e8));

    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      labelRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    })();

    // --- Scene helpers ---
    let objects = [];

    function clear() {
      objects.forEach(o => scene.remove(o));
      objects = [];
    }

    function arrow(dir, origin, color) {
      const d = new THREE.Vector3(...dir);
      const len = d.length();
      const a = new THREE.ArrowHelper(
        d.clone().normalize(),
        new THREE.Vector3(...origin),
        len, color, len * 0.18, len * 0.09
      );
      scene.add(a);
      objects.push(a);
    }

    function label(text, position, color) {
      const div = document.createElement('div');
      div.className = 'vec-label';
      div.textContent = text;
      div.style.color = color;
      const obj = new CSS2DObject(div);
      obj.position.set(...position);
      scene.add(obj);
      objects.push(obj);
    }

    function line(from, to, color) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(...from),
        new THREE.Vector3(...to)
      ]);
      const l = new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
      scene.add(l);
      objects.push(l);
    }

    function sphere(pos, radius, color) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 16, 16),
        new THREE.MeshBasicMaterial({ color })
      );
      mesh.position.set(...pos);
      scene.add(mesh);
      objects.push(mesh);
    }

    function parallelogram(a, b, color) {
      const ab = [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
      const O  = [0, 0, 0];
      const positions = new Float32Array([...O, ...a, ...b, ...a, ...ab, ...b]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.18 })
      );
      scene.add(mesh);
      objects.push(mesh);
      line(O, a, color);
      line(O, b, color);
      line(a, ab, color);
      line(b, ab, color);
    }

    function perpendicularDrop(from, color) {
      const to = [from[0], 0, 0];
      line(from, to, color);
      const s = 0.12;
      line([to[0], 0, 0], [to[0], s, 0], color);
      line([to[0], s, 0], [to[0]-s, s, 0], color);
    }

    // --- Concept data ---
    const r    = [2, 0, 0];
    const F    = [0, 2, 0];
    const rTip = r;

    const M = [
      r[1]*F[2] - r[2]*F[1],
      r[2]*F[0] - r[0]*F[2],
      r[0]*F[1] - r[1]*F[0]
    ]; // (0, 0, 4)

    const F_ang = [Math.SQRT2, Math.SQRT2, 0]; // |F|=2, 45°
    const M_ang = [
      r[1]*F_ang[2] - r[2]*F_ang[1],
      r[2]*F_ang[0] - r[0]*F_ang[2],
      r[0]*F_ang[1] - r[1]*F_ang[0]
    ]; // (0, 0, 2√2)

    const steps = [
      {
        title: "The Setup",
        description: "Think of a wrench. The pivot O is where it's fixed. The vector r runs from the pivot to the point where you apply the force. F is the force itself.",
        equation: "\\vec{M} = \\vec{r} \\times \\vec{F}",
        notes: "r = (2, 0, 0)  — the arm along the x-axis\nF = (0, 2, 0)  — force pushing upward\n\nThe force F is applied at the tip of r, not at the pivot. That's what gives it turning power.",
        render() {
          sphere([0,0,0], 0.1, 0x333333);
          sphere(rTip, 0.08, 0x1565c0);
          arrow(r, [0,0,0], 0x1565c0);
          arrow(F, rTip, 0xc62828);
          label('O',  [-0.25, 0.2, 0],       '#333333');
          label('r',  [1,     0.25, 0],       '#1565c0');
          label('F',  [2.2,   1,    0],       '#c62828');
        }
      },
      {
        title: "Computing the Moment",
        description: "The moment is the cross product of r and F. Expand the determinant — the result is a vector, not a scalar.",
        equation: `\\vec{M} = \\vec{r}\\times\\vec{F} = \\begin{vmatrix}\\mathbf{i}&\\mathbf{j}&\\mathbf{k}\\\\2&0&0\\\\0&2&0\\end{vmatrix}`,
        notes: "i: (0)(0) − (0)(2) = 0\nj: −[(2)(0) − (0)(0)] = 0\nk: (2)(2) − (0)(0) = 4\n\nM = (0, 0, 4)",
        render() {
          sphere([0,0,0], 0.1, 0x333333);
          sphere(rTip, 0.08, 0x1565c0);
          arrow(r, [0,0,0], 0x1565c0);
          arrow(F, rTip, 0xc62828);
          label('O',  [-0.25, 0.2, 0], '#333333');
          label('r',  [1,     0.25, 0], '#1565c0');
          label('F',  [2.2,   1,    0], '#c62828');
        }
      },
      {
        title: "The Moment Vector",
        description: "The moment M = (0, 0, 4) points along the z-axis. Its direction is the axis of rotation — counterclockwise when viewed from above. Its magnitude is the turning strength.",
        equation: "\\vec{M} = (0,\\,0,\\,4) \\qquad |\\vec{M}| = 4 \\text{ N·m}",
        notes: "M is perpendicular to both r and F — exactly like the cross product.\n\nRight-hand rule: curl fingers from r toward F → thumb points in the direction of M (+z).\n\nOrbit and look down the z-axis to see the rotation.",
        render() {
          sphere([0,0,0], 0.1, 0x333333);
          sphere(rTip, 0.08, 0x1565c0);
          arrow(r, [0,0,0], 0x1565c0);
          arrow(F, rTip, 0xc62828);
          arrow(M, [0,0,0], 0xe65100);
          label('O',  [-0.25, 0.2,  0],    '#333333');
          label('r',  [1,     0.25, 0],    '#1565c0');
          label('F',  [2.2,   1,    0],    '#c62828');
          label('M',  [0.25,  0.25, 4.3],  '#e65100');
        }
      },
      {
        title: "Perpendicular Force = Maximum Moment",
        description: "The moment magnitude depends on the angle between r and F. A force perpendicular to the arm gives the most turning power. A force along the arm gives none.",
        equation: "|\\vec{M}| = |\\vec{r}|\\,|\\vec{F}|\\sin\\theta",
        notes: "F ⊥ r (θ=90°):   |M| = 2×2×1 = 4     ← maximum\nF at 45° (θ=45°): |M| = 2×2×0.71 ≈ 2.83\nF ∥ r (θ=0°):    |M| = 2×2×0 = 0     ← no rotation\n\nThis is why you push a door handle perpendicular to the door.",
        render() {
          sphere([0,0,0], 0.1, 0x333333);
          sphere(rTip, 0.08, 0x1565c0);
          arrow(r,     [0,0,0], 0x1565c0);
          arrow(F,     rTip,    0xc62828);
          arrow(M,     [0,0,0], 0xe65100);
          arrow(F_ang, rTip,    0xf48fb1);
          arrow(M_ang, [0,0,0], 0xffcc80);
          perpendicularDrop([rTip[0], F[1], 0], 0xaaaaaa);
          label('O',   [-0.25, 0.2,  0],   '#333333');
          label('r',   [1,     0.25, 0],   '#1565c0');
          label('F',   [2.2,   2.2,  0],   '#c62828');
          label("F'",  [2.2,   1.6,  0],   '#e91e63');
          label('M',   [0.25,  0.25, 4.3], '#e65100');
          label("M'",  [0.25,  0.25, 3.0], '#f57c00');
        }
      },
      {
        title: "The Parallelogram Connection",
        description: "The magnitude of the moment equals the area of the parallelogram formed by r and F — this is exactly what the cross product magnitude measures. The bigger the parallelogram, the stronger the moment.",
        equation: "|\\vec{M}| = |\\vec{r}\\times\\vec{F}| = \\text{Area of parallelogram} = 4",
        notes: "r sweeps out the arm length.\nF sweeps out the force magnitude.\nThe area captures both.\n\n|r| = 2, |F| = 2, θ = 90°\nArea = 2 × 2 × sin(90°) = 4 ✓",
        render() {
          sphere([0,0,0], 0.1, 0x333333);
          sphere(rTip, 0.08, 0x1565c0);
          arrow(r, [0,0,0], 0x1565c0);
          arrow(F, rTip,    0xc62828);
          arrow(M, [0,0,0], 0xe65100);
          parallelogram(r, F, 0x5c6bc0);
          label('O', [-0.25, 0.2,  0],   '#333333');
          label('r', [1,     0.25, 0],   '#1565c0');
          label('F', [2.2,   1,    0],   '#c62828');
          label('M', [0.25,  0.25, 4.3], '#e65100');
        }
      }
    ];

    // --- UI ---
    let current = 0;

    function go(i) {
      current = i;
      clear();
      const step = steps[i];
      step.render();

      document.getElementById('step-title').textContent       = step.title;
      document.getElementById('step-description').textContent = step.description;
      document.getElementById('step-notes').textContent       = step.notes;
      document.getElementById('counter').textContent          = `${i + 1} / ${steps.length}`;

      katex.render(step.equation, document.getElementById('equation'), {
        throwOnError: false,
        displayMode: true
      });

      document.getElementById('prev').disabled = i === 0;
      document.getElementById('next').disabled = i === steps.length - 1;
    }

    document.getElementById('prev').addEventListener('click', () => go(current - 1));
    document.getElementById('next').addEventListener('click', () => go(current + 1));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' && current < steps.length - 1) go(current + 1);
      if (e.key === 'ArrowLeft'  && current > 0)               go(current - 1);
    });

    go(0);
  </script>
</body>
</html>
