<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plane Motion – Kinematics</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="../shared/layout.css">
  <style>
    .vec-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 16px;
      font-weight: bold;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 6px #fff, 0 0 6px #fff;
    }
    .vec-label.small {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div id="panel">
      <a href="../index.html" id="back">← All visualizations</a>
      <div id="subject">Kinematics</div>
      <h1 id="step-title"></h1>
      <p id="step-description"></p>
      <div id="equation"></div>
      <p id="step-notes"></p>
      <div id="nav">
        <button id="prev">← Prev</button>
        <span id="counter"></span>
        <button id="next">Next →</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }              from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- Scene ---
    const canvas    = document.getElementById('canvas');
    const container = document.getElementById('canvas-container');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.domElement.style.position     = 'absolute';
    labelRenderer.domElement.style.top          = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    container.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 7, 4);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.AxesHelper(3));
    scene.add(new THREE.GridHelper(8, 8, 0xcccccc, 0xe8e8e8));

    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      renderer.setSize(w, h);
      labelRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Motion parametrisation ---
    // r(t) = R0 + Ramp·cos(t)  — radius oscillates (point moves in/out)
    // θ(t) = θ_dot · t          — sweeps at constant angular rate
    // This gives a non-circular path with both ṙ ≠ 0 and θ̇ ≠ 0
    const R0      = 1.6;
    const R_AMP   = 0.6;
    const TH_DOT  = 0.9;  // rad/s

    function state(t) {
      const r      = R0 + R_AMP * Math.cos(t);
      const rdot   = -R_AMP * Math.sin(t);
      const theta  = TH_DOT * t;
      const cosT   = Math.cos(theta), sinT = Math.sin(theta);

      // Rotating unit vectors
      const er  = [cosT,  sinT,  0];
      const eth = [-sinT, cosT,  0];

      // Position
      const px = r * cosT, py = r * sinT;

      // Velocity components
      const vr_mag  = rdot;          // signed: + = outward, − = inward
      const vth_mag = r * TH_DOT;   // always positive for CCW spin

      return { r, rdot, theta, er, eth, px, py, vr_mag, vth_mag };
    }

    // Precompute path for background display
    const PATH_STEPS = 300;
    const PATH_T     = (2 * Math.PI / TH_DOT) * 2; // two full rotations
    const pathPoints = [];
    for (let i = 0; i <= PATH_STEPS; i++) {
      const t = (i / PATH_STEPS) * PATH_T;
      const s = state(t);
      pathPoints.push(new THREE.Vector3(s.px, s.py, 0));
    }

    // --- Object management ---
    let objects = [];
    function clear() { objects.forEach(o => scene.remove(o)); objects = []; }

    let live = [];
    function clearLive() { live.forEach(o => scene.remove(o)); live = []; }

    // --- Helpers ---
    function mkArrow(dir, origin, color, len_override, arr) {
      const pool = arr || objects;
      const d    = new THREE.Vector3(...dir);
      const len  = len_override ?? d.length();
      if (len < 0.001) return;
      const a = new THREE.ArrowHelper(
        d.clone().normalize(), new THREE.Vector3(...origin),
        len, color, Math.min(len * 0.22, 0.35), Math.min(len * 0.11, 0.18)
      );
      scene.add(a); pool.push(a);
    }

    function mkLabel(text, pos, color, small, arr) {
      const pool = arr || objects;
      const div  = document.createElement('div');
      div.className   = small ? 'vec-label small' : 'vec-label';
      div.textContent = text;
      div.style.color = color;
      const obj = new CSS2DObject(div);
      obj.position.set(...pos);
      scene.add(obj); pool.push(obj);
    }

    function mkSphere(pos, r, color, arr) {
      const pool = arr || objects;
      const m    = new THREE.Mesh(
        new THREE.SphereGeometry(r, 16, 16),
        new THREE.MeshBasicMaterial({ color })
      );
      m.position.set(...pos);
      scene.add(m); pool.push(m);
    }

    function mkLine(pts, color, arr) {
      const pool = arr || objects;
      const geo  = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(...p)));
      const l    = new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
      scene.add(l); pool.push(l);
    }

    function drawPath() {
      const geo = new THREE.BufferGeometry().setFromPoints(pathPoints);
      const l   = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xdddddd }));
      scene.add(l); objects.push(l);
    }

    function drawOrigin() {
      mkSphere([0, 0, 0], 0.08, 0x333333);
      mkLabel('O', [-0.25, 0.15, 0], '#333333');
    }

    // --- Animation state ---
    let simTime  = 0.4;
    let lastTime = performance.now();

    // Per-step display flags
    let cfg = { er: false, eth: false, r_vec: false, vr: false, vth: false, v_total: false };

    function updateLive() {
      const now = performance.now();
      const dt  = (now - lastTime) / 1000;
      lastTime  = now;
      simTime  += dt * 0.55; // slow enough to read clearly

      const s = state(simTime);

      clearLive();

      // Point P
      mkSphere([s.px, s.py, 0], 0.13, 0x1a237e, live);
      mkLabel('P', [s.px + 0.15, s.py + 0.2, 0], '#1a237e', false, live);

      // r scalar label along ê_r
      if (cfg.r_vec) {
        mkLine([[0, 0, 0], [s.px, s.py, 0]], 0x999999, live);
        mkLabel('r', [s.px * 0.45 + 0.15, s.py * 0.45 + 0.15, 0], '#555', true, live);
      }

      const FRAME_LEN = 0.9; // visual length of unit vectors

      // ê_r (radial unit vector)
      if (cfg.er) {
        const tip = [s.px + s.er[0] * FRAME_LEN, s.py + s.er[1] * FRAME_LEN, 0];
        mkArrow(s.er, [s.px, s.py, 0], 0x1565c0, FRAME_LEN, live);
        mkLabel('êᵣ', [tip[0] + 0.1, tip[1] + 0.1, 0], '#1565c0', true, live);
      }

      // ê_θ (transverse unit vector)
      if (cfg.eth) {
        const tip = [s.px + s.eth[0] * FRAME_LEN, s.py + s.eth[1] * FRAME_LEN, 0];
        mkArrow(s.eth, [s.px, s.py, 0], 0x2e7d32, FRAME_LEN, live);
        mkLabel('êθ', [tip[0] + 0.1, tip[1] + 0.1, 0], '#2e7d32', true, live);
      }

      // Radial velocity component  (ṙ · ê_r)
      if (cfg.vr) {
        const vr = s.er.map(c => c * s.vr_mag);
        const tip = [s.px + vr[0], s.py + vr[1], 0];
        if (Math.abs(s.vr_mag) > 0.05) {
          mkArrow(vr, [s.px, s.py, 0], 0x1565c0, undefined, live);
          mkLabel('ṙêᵣ', [tip[0] + 0.1, tip[1] + 0.1, 0], '#1565c0', true, live);
        }
      }

      // Transverse velocity component  (r·θ̇ · ê_θ)
      if (cfg.vth) {
        const vth = s.eth.map(c => c * s.vth_mag);
        const tip  = [s.px + vth[0], s.py + vth[1], 0];
        mkArrow(vth, [s.px, s.py, 0], 0x2e7d32, undefined, live);
        mkLabel('rθ̇êθ', [tip[0] + 0.1, tip[1] + 0.1, 0], '#2e7d32', true, live);
      }

      // Total velocity vector
      if (cfg.v_total) {
        const vr  = s.er.map(c  => c * s.vr_mag);
        const vth = s.eth.map(c => c * s.vth_mag);
        const vtot = [vr[0] + vth[0], vr[1] + vth[1], 0];
        const tip  = [s.px + vtot[0], s.py + vtot[1], 0];
        mkArrow(vtot, [s.px, s.py, 0], 0xe65100, undefined, live);
        mkLabel('v', [tip[0] + 0.1, tip[1] + 0.15, 0], '#e65100', false, live);

        // Dashed parallelogram sides to show decomposition
        const vr_end  = [s.px + vr[0],  s.py + vr[1],  0];
        const vth_end = [s.px + vth[0], s.py + vth[1], 0];
        mkLine([[s.px, s.py, 0], vr_end],  0xaaaaee, live);
        mkLine([[s.px, s.py, 0], vth_end], 0xaaeebb, live);
        mkLine([vr_end,  [s.px + vtot[0], s.py + vtot[1], 0]], 0xaaeebb, live);
        mkLine([vth_end, [s.px + vtot[0], s.py + vtot[1], 0]], 0xaaaaee, live);
      }
    }

    // --- Animate loop ---
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateLive();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    })();

    // --- Steps ---
    const steps = [
      {
        title: "A Moving Point in a Plane",
        description: "Point P moves along a curved path. Unlike circular motion, it both rotates around O and changes its distance from O. Cartesian (x, y) coordinates can describe it — but polar coordinates (r, θ) are often more natural.",
        equation: "\\text{position} = (r,\\,\\theta) \\quad\\text{instead of}\\quad (x,\\,y)",
        notes: "r = distance from O to P\nθ = angle from the x-axis\n\nNotice r is not constant — P drifts inward and outward as it sweeps around.\n\nDrag to orbit. The motion is in the xy-plane.",
        setup() {
          cfg = { er: false, eth: false, r_vec: true, vr: false, vth: false, v_total: false };
          drawPath(); drawOrigin();
        }
      },
      {
        title: "The Rotating Frame: êᵣ and êθ",
        description: "In polar coordinates we attach two unit vectors directly to P. êᵣ always points radially outward from O. êθ always points 90° counterclockwise from êᵣ — in the direction of increasing θ. Unlike î and ĵ, these vectors rotate as P moves.",
        equation: "\\hat{e}_r = (\\cos\\theta,\\sin\\theta) \\qquad \\hat{e}_\\theta = (-\\sin\\theta,\\cos\\theta)",
        notes: "Watch êᵣ (blue) and êθ (green) rotate as P orbits.\n\nKey difference from Cartesian: î and ĵ are fixed in space. êᵣ and êθ are fixed to the point — they change direction continuously.\n\nThis is what makes the velocity expression richer.",
        setup() {
          cfg = { er: true, eth: true, r_vec: true, vr: false, vth: false, v_total: false };
          drawPath(); drawOrigin();
        }
      },
      {
        title: "Radial Velocity: ṙ êᵣ",
        description: "The radial component of velocity describes how fast P is moving toward or away from O. ṙ (r-dot) is the rate of change of r. When positive, P is moving outward along êᵣ. When negative, P is moving inward.",
        equation: "\\vec{v}_{\\text{radial}} = \\dot{r}\\,\\hat{e}_r",
        notes: "Watch the blue arrow — it flips direction as P moves inward vs outward.\n\nFor circular motion, r = constant so ṙ = 0 and this component vanishes entirely.\n\nThis is the component the dot product saw: v · êᵣ = ṙ.",
        setup() {
          cfg = { er: true, eth: false, r_vec: true, vr: true, vth: false, v_total: false };
          drawPath(); drawOrigin();
        }
      },
      {
        title: "Transverse Velocity: rθ̇ êθ",
        description: "The transverse component describes how fast P sweeps around O. θ̇ (theta-dot) is the angular velocity from before. The r factor matters: a point further from O covers more arc length for the same angular speed.",
        equation: "\\vec{v}_{\\text{transverse}} = r\\dot{\\theta}\\,\\hat{e}_\\theta",
        notes: "This is exactly v = ω × r from the previous visualization — expressed in the rotating frame.\n\nWatch how the green arrow grows longer when P is far from O (large r) and shorter when P is close (small r).\n\nFor circular motion, this is the only component: v = rω.",
        setup() {
          cfg = { er: false, eth: true, r_vec: true, vr: false, vth: true, v_total: false };
          drawPath(); drawOrigin();
        }
      },
      {
        title: "Total Velocity: Both Components",
        description: "The full velocity is the vector sum of the two components. The orange arrow is the actual velocity of P. The parallelogram shows how the blue (radial) and green (transverse) components add up to give it.",
        equation: "\\vec{v} = \\dot{r}\\,\\hat{e}_r + r\\dot{\\theta}\\,\\hat{e}_\\theta",
        notes: "This is the polar form of velocity — the fundamental result of plane kinematics.\n\nThe radial component ṙêᵣ comes from changing distance.\nThe transverse component rθ̇êθ comes from rotating around O.\n\nBoth come from differentiating r = r·êᵣ once, accounting for the fact that êᵣ itself is rotating.",
        setup() {
          cfg = { er: true, eth: true, r_vec: true, vr: true, vth: true, v_total: true };
          drawPath(); drawOrigin();
        }
      }
    ];

    // --- UI ---
    let current = 0;

    function go(i) {
      current = i;
      clear();
      steps[i].setup();

      document.getElementById('step-title').textContent       = steps[i].title;
      document.getElementById('step-description').textContent = steps[i].description;
      document.getElementById('step-notes').textContent       = steps[i].notes;
      document.getElementById('counter').textContent          = `${i + 1} / ${steps.length}`;

      katex.render(steps[i].equation, document.getElementById('equation'), {
        throwOnError: false, displayMode: true
      });

      document.getElementById('prev').disabled = i === 0;
      document.getElementById('next').disabled = i === steps.length - 1;
    }

    document.getElementById('prev').addEventListener('click', () => go(current - 1));
    document.getElementById('next').addEventListener('click', () => go(current + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' && current < steps.length - 1) go(current + 1);
      if (e.key === 'ArrowLeft'  && current > 0)               go(current - 1);
    });

    go(0);
  </script>
</body>
</html>
